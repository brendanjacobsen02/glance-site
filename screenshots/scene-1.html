<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap"
    />
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <div class="scene">
      <div class="caption">
        <h2>One tap.<br />Someone <span class="amber">new</span>.</h2>
        <p>Random video chat for your campus.</p>
      </div>

      <div class="phone-wrap">
        <div class="phone">
          <div class="screen">
            <div class="statusbar">
              <span>9:41</span>
              <span class="glyphs">5G&nbsp;&nbsp;100</span>
            </div>
            <div class="app-head">
              <span class="app-wordmark">Glance</span>
              <span class="online"><span class="dot"></span>128 online</span>
            </div>
            <div class="home">
              <div class="radar">
                <span class="ring r3"></span>
                <span class="ring r2"></span>
                <span class="ring r1"></span>
                <span class="core"></span>
              </div>
              <div class="lead">
                <div class="k">Ready when you are</div>
                <div class="s">Tap to get matched with someone online right now</div>
              </div>
              <div class="cta-pill">Find someone</div>
            </div>
            <div class="home-nav">
              <span class="on">Home</span>
              <span>People</span>
              <span>Profile</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
