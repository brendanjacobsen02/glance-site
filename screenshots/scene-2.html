<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <div class="scene">
      <div class="caption">
        <h2>Matched, not <span class="amber">random</span>.</h2>
        <p>A few quick taps tune who you meet.</p>
      </div>
      <div class="phone-wrap">
        <div class="phone">
          <div class="screen">
            <div class="statusbar"><span>9:41</span><span class="glyphs">5G&nbsp;&nbsp;100</span></div>
            <div class="quiz">
              <div class="progress"><i></i></div>
              <div class="q-step">About you · 3 of 8</div>
              <div class="q-title">What's your ideal Friday night?</div>
              <div class="opts">
                <div class="opt"><span class="e">🎉</span> Out till late</div>
                <div class="opt sel"><span class="e">🍜</span> A small kickback</div>
                <div class="opt"><span class="e">🌙</span> Quiet night in</div>
                <div class="opt"><span class="e">🎲</span> Wherever it goes</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
