<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&display=swap" />
    <link rel="stylesheet" href="shot.css" />
  </head>
  <body>
    <div class="scene">
      <div class="caption">
        <h2>Say hi. Then tap <span class="amber">Next</span>.</h2>
        <p>Every call is a brand-new person.</p>
      </div>
      <div class="phone-wrap">
        <div class="phone">
          <div class="screen">
            <div class="statusbar"><span>9:41</span><span class="glyphs">5G&nbsp;&nbsp;100</span></div>
            <div class="match">
              <div class="avatar">🙂</div>
              <div class="name">Maya, 21</div>
              <div class="status"><span class="dot"></span>Connected</div>
              <div class="controls">
                <div class="ctl">⚐</div>
                <div class="next">Next</div>
                <div class="ctl">♡</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
